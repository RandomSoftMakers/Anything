name: Build and Package Anything

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Anything.sln

    - name: Build Avalonia
      run: dotnet build Anything.UI.Avalonia/Anything.UI.Avalonia.csproj -c ${{ matrix.configuration }}

    - name: Publish Avalonia (Linux)
      run: |
        dotnet publish Anything.UI.Avalonia/Anything.UI.Avalonia.csproj -c ${{ matrix.configuration }} -r linux-x64 --self-contained true -p:PublishSingleFile=true -o dist/linux-x64

    - name: Create DEB package
      run: |
        mkdir -p packaging/deb/anything/usr/bin
        mkdir -p packaging/deb/anything/usr/share/applications
        mkdir -p packaging/deb/anything/usr/share/icons
        cp dist/linux-x64/Anything.UI.Avalonia packaging/deb/anything/usr/bin/anything
        chmod +x packaging/deb/anything/usr/bin/anything
        mkdir -p packaging/deb/anything/DEBIAN
        cp packaging/deb/control packaging/deb/anything/DEBIAN/ || true
        echo "Package: anything
        Version: 1.0.0
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: AnythingDevelopmentTeam
        Description: Lightning fast local file search" > packaging/deb/anything/DEBIAN/control
        cp icon.png packaging/deb/anything/usr/share/icons/anything.png 2>/dev/null || true
        dpkg-deb --build packaging/deb/anything anything.deb || echo "DEB creation skipped"

    - name: Create RPM package
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        VERSION="1.0.0"
        mkdir -p staging/anything-$VERSION
        cp dist/linux-x64/Anything.UI.Avalonia staging/anything-$VERSION/
        cp icon.png staging/anything-$VERSION/
        tar czf ~/rpmbuild/SOURCES/anything-$VERSION.tar.gz -C staging anything-$VERSION
        cp packaging/rpm/anything.spec ~/rpmbuild/SPECS/
        rpmbuild -bb ~/rpmbuild/SPECS/anything.spec \
          --define "_topdir $HOME/rpmbuild" 2>&1
        RPM_FILE=$(find ~/rpmbuild/RPMS -name "*.rpm" | head -1)
        if [ -n "$RPM_FILE" ]; then
          cp "$RPM_FILE" dist/Anything-Linux.rpm
          echo "RPM created"
        fi

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-Linux-x64
        path: dist/linux-x64/

    - name: Upload DEB Package
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Anything-Linux-deb
        path: anything.deb
        if-no-files-found: ignore

    - name: Upload RPM Package
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Anything-Linux-rpm
        path: dist/Anything-Linux.rpm
        if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Anything.sln

    - name: Build Avalonia
      run: dotnet build Anything.UI.Avalonia/Anything.UI.Avalonia.csproj -c ${{ matrix.configuration }}

    - name: Publish Avalonia (macOS)
      run: |
        dotnet publish Anything.UI.Avalonia/Anything.UI.Avalonia.csproj -c ${{ matrix.configuration }} -r osx-x64 --self-contained true -p:PublishSingleFile=true -o dist/osx-x64

    - name: Create macOS DMG
      run: |
        mkdir -p dist/dmg
        cp -r dist/osx-x64 dist/dmg/Anything.app
        hdiutil create -volname "Anything" -srcfolder dist/dmg -ov -format UDZO dist/Anything-macOS.dmg || echo "DMG creation skipped"

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-macOS-x64
        path: dist/osx-x64/

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Anything-macOS-dmg
        path: dist/Anything-macOS.dmg
        if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Anything.sln

    - name: Build Avalonia
      run: dotnet build Anything.UI.Avalonia/Anything.UI.Avalonia.csproj -c ${{ matrix.configuration }}

    - name: Publish Avalonia (Windows)
      run: |
        dotnet publish Anything.UI.Avalonia/Anything.UI.Avalonia.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64

    - name: Copy icon to dist
      run: |
        if (Test-Path "icon.png") {
          Copy-Item "icon.png" -Destination "dist/win-x64/" -Force
          echo "Icon copied to dist/win-x64"
        } else {
          echo "icon.png not found in repo root"
        }

    - name: Create MSI Installer
      run: |
        choco install wixtoolset -y 2>$null
        $wixPaths = @(
          "C:\Program Files (x86)\WiX Toolset v3.11\bin",
          "C:\Program Files\WiX Toolset v3.11\bin",
          "C:\ProgramData\chocolatey\lib\wixtoolset\tools\bin"
        )
        foreach ($p in $wixPaths) {
          if (Test-Path "$p\candle.exe") {
            $env:PATH += ";$p"
            echo "Found WiX at $p"
            break
          }
        }
        if (Test-Path "packaging/windows/Product.wxs") {
          cd packaging/windows
          candle.exe -dSourceDir="..\..\dist\win-x64" Product.wxs
          light.exe -out "..\..\dist\Anything-Setup.msi" Product.wixobj
          cd ..\..
          if (Test-Path "dist\Anything-Setup.msi") {
            echo "MSI created successfully"
          } else {
            echo "MSI creation failed"
          }
        } else {
          echo "WiX source not found, skipping MSI creation"
        }
      shell: powershell

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-Windows-x64
        path: dist/win-x64/

    - name: Upload MSI Installer
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Anything-Windows-MSI
        path: dist/Anything-Setup.msi
        if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Android workload
      run: dotnet workload install android

    - name: Build Android
      run: dotnet publish Anything.UI.Avalonia.Android/Anything.UI.Avalonia.Android.csproj -c Release -r android-arm64 -o dist/android

    - name: Upload Android Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-Android
        path: dist/android/

  build-flatpak:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Anything.sln

    - name: Publish Avalonia (Linux)
      run: |
        dotnet publish Anything.UI.Avalonia/Anything.UI.Avalonia.csproj \
          -c Release -r linux-x64 --self-contained true \
          -p:PublishSingleFile=true \
          -o dist/flatpak-app

    - name: Setup Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    - name: Build Flatpak
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        FLATPAK_ID="io.github.${OWNER}.anything"
        BUILD_DIR="dist/flatpak-build"
        EXPORT_DIR="dist/flatpak-export"
        APP_DIR="$BUILD_DIR/files"

        flatpak build-init \
          "$BUILD_DIR" "$FLATPAK_ID" \
          org.freedesktop.Platform//24.08 \
          org.freedesktop.Sdk//24.08

        mkdir -p "$APP_DIR/bin"
        mkdir -p "$APP_DIR/share/applications"
        mkdir -p "$APP_DIR/share/icons/hicolor/256x256/apps"
        mkdir -p "$APP_DIR/share/metainfo"

        cp dist/flatpak-app/Anything.UI.Avalonia "$APP_DIR/bin/anything"
        chmod +x "$APP_DIR/bin/anything"

        cp icon.png "$APP_DIR/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png"

        cat > "$APP_DIR/share/applications/$FLATPAK_ID.desktop" << DESKTOP_EOF
        [Desktop Entry]
        Name=Anything
        Comment=Local file search
        Exec=/app/bin/anything
        Icon=$FLATPAK_ID
        Terminal=false
        Type=Application
        Categories=Utility;Search;
        DESKTOP_EOF

        cat > "$APP_DIR/share/metainfo/$FLATPAK_ID.metainfo.xml" << METAINFO_EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="desktop-application">
          <id>$FLATPAK_ID</id>
          <metadata_license>CC0-1.0</metadata_license>
          <project_license>GPL-3.0</project_license>
          <name>Anything</name>
          <summary>Lightning fast local file search tool</summary>
          <description>
            <p>A cross-platform file search tool with instant results.</p>
          </description>
          <categories>
            <category>Utility</category>
          </categories>
          <url type="homepage">https://github.com/${{ github.repository }}</url>
          <content_rating type="oars-1.1" />
          <launchable type="desktop-id">$FLATPAK_ID.desktop</launchable>
        </component>
        METAINFO_EOF

        flatpak build-finish "$BUILD_DIR" \
          --socket=x11 \
          --socket=wayland \
          --share=ipc \
          --filesystem=host \
          --device=dri \
          --command=anything

        flatpak build-export \
          "$EXPORT_DIR" "$BUILD_DIR"

        flatpak build-bundle \
          "$EXPORT_DIR" dist/Anything-Linux.flatpak \
          "$FLATPAK_ID"

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-Linux-flatpak
        path: dist/Anything-Linux.flatpak

  create-release:
    needs: [build-linux, build-macos, build-windows, build-flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Linux build
      uses: actions/download-artifact@v4
      with:
        name: Anything-Linux-x64
        path: dist/linux-x64

    - name: Download Linux DEB
      uses: actions/download-artifact@v4
      with:
        name: Anything-Linux-deb
        path: dist/
      continue-on-error: true

    - name: Download Linux RPM
      uses: actions/download-artifact@v4
      with:
        name: Anything-Linux-rpm
        path: dist/
      continue-on-error: true

    - name: Download Linux Flatpak
      uses: actions/download-artifact@v4
      with:
        name: Anything-Linux-flatpak
        path: dist/
      continue-on-error: true

    - name: Download macOS build
      uses: actions/download-artifact@v4
      with:
        name: Anything-macOS-x64
        path: dist/osx-x64

    - name: Download macOS DMG
      uses: actions/download-artifact@v4
      with:
        name: Anything-macOS-dmg
        path: dist/
      continue-on-error: true

    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: Anything-Windows-x64
        path: dist/win-x64

    - name: Download Windows MSI
      uses: actions/download-artifact@v4
      with:
        name: Anything-Windows-MSI
        path: dist/
      continue-on-error: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/linux-x64/Anything.UI.Avalonia
          dist/osx-x64/Anything.UI.Avalonia
          dist/win-x64/Anything.UI.Avalonia.exe
          dist/Anything-Setup.msi
          dist/Anything-macOS.dmg
          dist/anything.deb
          dist/Anything-Linux.rpm
          dist/Anything-Linux.flatpak
        body: |
          ## Anything Release

          ### Downloads
          - **Linux**: `Anything.UI.Avalonia` (64-bit) or `anything.deb` or `Anything-Linux.rpm` or `Anything-Linux.flatpak`
          - **macOS**: `Anything.UI.Avalonia` (64-bit) or `Anything-macOS.dmg`
          - **Windows**: `Anything.UI.Avalonia.exe` (64-bit) or `Anything-Setup.msi`

          ### Installation
          See [INSTALL.md](https://github.com/AnythingDevelopmentTeam/Anything/blob/main/INSTALL.md) for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
