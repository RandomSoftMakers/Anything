name: Build Flatpak and RPM

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-flatpak:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Anything.sln

    - name: Publish Avalonia (Linux)
      run: |
        dotnet publish Anything.UI.Avalonia/Anything.UI.Avalonia.csproj \
          -c Release -r linux-x64 --self-contained true \
          -p:PublishSingleFile=true \
          -o dist/flatpak-app

    - name: Setup Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak
        flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

    - name: Build Flatpak
      run: |
        FLATPAK_ID="io.github.randomsoftmakers.anything"
        BUILD_DIR="dist/flatpak-build"
        EXPORT_DIR="dist/flatpak-export"
        APP_DIR="$BUILD_DIR/files"

        # Initialize build directory with the runtime
        flatpak build-init \
          --runtime=org.freedesktop.Platform//24.08 \
          --sdk=org.freedesktop.Sdk//24.08 \
          "$BUILD_DIR" "$FLATPAK_ID"

        # Create directory structure
        mkdir -p "$APP_DIR/bin"
        mkdir -p "$APP_DIR/share/applications"
        mkdir -p "$APP_DIR/share/icons/hicolor/256x256/apps"
        mkdir -p "$APP_DIR/share/metainfo"

        # Install the binary
        cp dist/flatpak-app/Anything.UI.Avalonia "$APP_DIR/bin/anything"
        chmod +x "$APP_DIR/bin/anything"

        # Install icon
        cp icon.png "$APP_DIR/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png"

        # Install .desktop file
        cat > "$APP_DIR/share/applications/$FLATPAK_ID.desktop" << DESKTOP_EOF
[Desktop Entry]
Name=Anything
Comment=Lightning fast local file search
Exec=/app/bin/anything
Icon=$FLATPAK_ID
Terminal=false
Type=Application
Categories=Utility;Search;
DESKTOP_EOF

        # Install AppStream metadata
        cp packaging/flatpak/$FLATPAK_ID.metainfo.xml \
           "$APP_DIR/share/metainfo/$FLATPAK_ID.metainfo.xml"

        # Set finish args (permissions)
        flatpak build-finish "$BUILD_DIR" \
          --socket=x11 \
          --socket=wayland \
          --share=ipc \
          --filesystem=host \
          --device=dri \
          --command=anything

        # Export to repository
        flatpak build-export \
          --runtime=org.freedesktop.Platform//24.08 \
          "$EXPORT_DIR" "$BUILD_DIR"

        # Create .flatpak bundle
        flatpak build-bundle \
          "$EXPORT_DIR" dist/Anything-Linux.flatpak \
          "$FLATPAK_ID"

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-Linux-flatpak
        path: dist/Anything-Linux.flatpak

  build-rpm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore Anything.sln

    - name: Publish Avalonia (Linux)
      run: |
        dotnet publish Anything.UI.Avalonia/Anything.UI.Avalonia.csproj \
          -c Release -r linux-x64 --self-contained true \
          -p:PublishSingleFile=true \
          -o dist/rpm-app

    - name: Install RPM build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm

    - name: Setup RPM build tree
      run: |
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

    - name: Create RPM source tarball
      run: |
        VERSION="1.0.0"
        mkdir -p staging/anything-$VERSION
        cp dist/rpm-app/Anything.UI.Avalonia staging/anything-$VERSION/
        cp icon.png staging/anything-$VERSION/
        tar czf ~/rpmbuild/SOURCES/anything-$VERSION.tar.gz \
          -C staging anything-$VERSION

    - name: Copy spec file
      run: |
        cp packaging/rpm/anything.spec ~/rpmbuild/SPECS/

    - name: Build RPM
      run: |
        rpmbuild -bb ~/rpmbuild/SPECS/anything.spec \
          --define "_topdir $HOME/rpmbuild" 2>&1

    - name: Find and Upload RPM
      run: |
        mkdir -p dist
        RPM_FILE=$(find ~/rpmbuild/RPMS -name "*.rpm" | head -1)
        if [ -n "$RPM_FILE" ]; then
          cp "$RPM_FILE" dist/Anything-Linux.rpm
          echo "RPM created: $RPM_FILE"
        else
          echo "No RPM file found"
          exit 1
        fi

    - name: Upload RPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anything-Linux-rpm
        path: dist/Anything-Linux.rpm
