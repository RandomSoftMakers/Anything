name: Flatpak
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y flatpak git \
            rust cargo gcc make \
            libzstd-devel
          flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release --manifest-path Cargo.toml --bin anything-gui

      - name: Build flatpak
        run: |
          BUILD_DIR=_build
          REPO_DIR=_repo
          flatpak build-init "$BUILD_DIR" io.github.anything \
            org.gnome.Sdk org.gnome.Platform 50
          install -Dm755 target/release/anything-gui \
            "$BUILD_DIR/files/bin/anything-gui"
          install -Dm644 flatpak/io.github.anything.desktop \
            "$BUILD_DIR/files/share/applications/io.github.anything.desktop"
          install -Dm644 flatpak/io.github.anything.metainfo.xml \
            "$BUILD_DIR/files/share/metainfo/io.github.anything.metainfo.xml"
          install -Dm644 icon.png \
            "$BUILD_DIR/files/share/icons/hicolor/96x96/apps/io.github.anything.png"
          install -Dm644 icon.png \
            "$BUILD_DIR/files/share/icons/hicolor/256x256/apps/io.github.anything.png"
          install -Dm644 LANG.ru.yaml \
            "$BUILD_DIR/files/share/anything/LANG.ru.yaml"
          install -Dm644 LANG.en.yaml \
            "$BUILD_DIR/files/share/anything/LANG.en.yaml"
          flatpak build-finish "$BUILD_DIR" \
            --socket=wayland \
            --socket=fallback-x11 \
            --socket=session-bus \
            --share=ipc \
            --filesystem=host \
            --device=dri
          flatpak build-export "$REPO_DIR" "$BUILD_DIR"
          flatpak build-bundle "$REPO_DIR" io.github.anything.flatpak \
            io.github.anything \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anything-flatpak
          path: io.github.anything.flatpak
