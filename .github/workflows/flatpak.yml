name: Flatpak
on:
  push:
    branches: [rewrite, main]
  pull_request:
    branches: [rewrite, main]

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y flatpak git \
            rust cargo gcc make \
            libzstd-devel
          flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Checkout Anything
        uses: actions/checkout@v4
        with:
          path: Anything

      - name: Checkout LibAnything
        uses: actions/checkout@v4
        with:
          repository: AnythingDevelopmentTeam/LibAnything
          path: LibAnything

      - name: Checkout SearchEngine
        uses: actions/checkout@v4
        with:
          repository: AnythingDevelopmentTeam/SearchEngine
          path: SearchEngine

      - name: Build release binary
        run: cargo build --release --manifest-path Anything/Cargo.toml --bin anything-gui

      - name: Build flatpak
        run: |
          APP_ID=io.github.anythingdevelopmentteam.anything
          BUILD_DIR=_build
          REPO_DIR=_repo
          flatpak build-init "$BUILD_DIR" "$APP_ID" \
            org.gnome.Sdk org.gnome.Platform 50
          install -Dm755 Anything/target/release/anything-gui \
            "$BUILD_DIR/files/bin/anything-gui"
          install -Dm644 Anything/flatpak/$APP_ID.desktop \
            "$BUILD_DIR/files/share/applications/$APP_ID.desktop"
          install -Dm644 Anything/flatpak/$APP_ID.metainfo.xml \
            "$BUILD_DIR/files/share/metainfo/$APP_ID.metainfo.xml"
          install -Dm644 Anything/icon.png \
            "$BUILD_DIR/files/share/icons/hicolor/96x96/apps/$APP_ID.png"
          install -Dm644 Anything/icon.png \
            "$BUILD_DIR/files/share/icons/hicolor/256x256/apps/$APP_ID.png"
          install -Dm644 Anything/LANG.ru.yaml \
            "$BUILD_DIR/files/share/anything/LANG.ru.yaml"
          install -Dm644 Anything/LANG.en.yaml \
            "$BUILD_DIR/files/share/anything/LANG.en.yaml"
          flatpak build-finish "$BUILD_DIR" \
            --socket=wayland \
            --socket=fallback-x11 \
            --socket=session-bus \
            --share=ipc \
            --filesystem=host \
            --device=dri
          flatpak build-export "$REPO_DIR" "$BUILD_DIR"
          flatpak build-bundle "$REPO_DIR" "$APP_ID.flatpak" \
            "$APP_ID" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anything-flatpak
          path: io.github.anythingdevelopmentteam.anything.flatpak
