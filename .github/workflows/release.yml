name: Build and Release

on:
  push:
    branches: ["rewrite"]
    tags:
      - "v*"
  pull_request:
    branches: ["legacy", "main", "rewrite"]
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  QT_ARCH: "win64_msvc2022_64"
  QT_DIR: 'C:\Qt\6.8.3'
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      # Checkout all three repos as siblings (same layout as local dev)
      - name: Checkout Anything
        uses: actions/checkout@v4
        with:
          path: Anything

      - name: Checkout SearchEngine
        uses: actions/checkout@v4
        with:
          repository: AnythingDevelopmentTeam/SearchEngine.git
          ref: main
          path: SearchEngine

      - name: Checkout LibAnything
        uses: actions/checkout@v4
        with:
          repository: AnythingDevelopmentTeam/LibAnything.git
          ref: main
          path: LibAnything

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Visual Studio dev shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt via aqtinstall
        run: |
          pip install aqtinstall
          aqt install-qt --outputdir C:\Qt windows desktop $env:QT_VERSION $env:QT_ARCH
          # Search for the actual Qt6 cmake config file
          $qtConfig = Get-ChildItem -Path "C:\Qt" -Recurse -Filter "Qt6Config.cmake" -ErrorAction SilentlyContinue -Depth 5 | Select-Object -First 1
          if ($qtConfig) {
            $qtDir = $qtConfig.Directory.Parent.Parent.FullName
            Write-Host "Found Qt at: $qtDir"
            "QT_DIR=$qtDir" | Out-File $env:GITHUB_ENV -Append
          } else {
            Write-Host "Qt6 not found. Listing C:\Qt..."
            Get-ChildItem -Path "C:\Qt" -Recurse -Depth 3 | Select-Object FullName
            exit 1
          }

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: SearchEngine

      - name: Build Rust (SearchEngine + LibAnything)
        run: cargo build --release
        working-directory: SearchEngine

      - name: Configure CMake
        run: |
          $qtDir = $env:QT_DIR
          if (-not (Test-Path "$qtDir\lib\cmake\Qt6\Qt6Config.cmake")) {
            $qtConfig = Get-ChildItem -Path "C:\Qt" -Recurse -Filter "Qt6Config.cmake" -ErrorAction SilentlyContinue -Depth 5 | Select-Object -First 1
            if ($qtConfig) {
              $qtDir = $qtConfig.Directory.Parent.Parent.FullName
            } else {
              Write-Host "Qt6 not found!"
              exit 1
            }
          }
          Write-Host "Qt cmake path: $qtDir"
          mkdir -p Anything/build
          cd Anything/build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$qtDir" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Qt application
        run: |
          cmake --build Anything/build --config Release -j ${env:NUMBER_OF_PROCESSORS}

      - name: Deploy Qt runtime DLLs
        run: |
          & "$env:QT_DIR\bin\windeployqt.exe" `
            --no-system-d3d-compiler `
            Anything/build/Release/AnythingUIQt.exe

      - name: Copy metadata
        run: |
          Copy-Item Anything/LICENSE   Anything/build/Release/
          Copy-Item Anything/README.md Anything/build/Release/

      - name: Create release archive
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $version) { $version = "0.1.0" }
          $pkgName = "AnythingUIQt-${version}-win64"
          Rename-Item Anything/build/Release $pkgName
          Compress-Archive -Path "${pkgName}/*" -DestinationPath "${pkgName}.zip" -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnythingUIQt-windows
          path: AnythingUIQt-*.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AnythingUIQt-*.zip
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Anything
        uses: actions/checkout@v4
        with:
          path: Anything

      - name: Checkout SearchEngine
        uses: actions/checkout@v4
        with:
          repository: AnythingDevelopmentTeam/SearchEngine.git
          ref: main
          path: SearchEngine

      - name: Checkout LibAnything
        uses: actions/checkout@v4
        with:
          repository: AnythingDevelopmentTeam/LibAnything.git
          ref: main
          path: LibAnything

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev libgl1-mesa-dev

      - name: Build Rust
        run: cargo build --release
        working-directory: SearchEngine

      - name: Configure CMake
        run: |
          mkdir -p Anything/build && cd Anything/build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build Qt application
        run: make -j$(nproc)
        working-directory: Anything/build

      - name: Package
        run: |
          cd Anything
          mkdir -p _stage
          cp "build/AnythingUIQt" "build/libsearchengine.so" _stage/
          cp LICENSE README.md _stage/
          cd _stage
          ver="${GITHUB_REF_NAME#v}"
          [ -z "$ver" ] && ver="0.1.0"
          tar czf "../../AnythingUIQt-${ver}-linux-x64.tar.gz" *

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnythingUIQt-linux
          path: AnythingUIQt-*-linux-x64.tar.gz

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AnythingUIQt-*-linux-x64.tar.gz
